# Opt-in employee API preview over a clean Web profile, never a shared maintenance home.
# The guide owns deployment requirements; later patches and filesystem authors remain trusted.
# Native subprocess stays for the fixed Frappe helper, not for a model-facing shell.

- id: tools
  config:
    mode: native

- id: agent-presets
  config:
    default: employee-readonly
    includeShippedRoot: false
    includeUserRoot: false
    roots:
      - path: !!js process.env.DSH_EMPLOYEE_PRESET_ROOT
        trust: system

- id: session-controller
  config:
    nativeOpen: false

- id: typert-gateway
  config:
    allowedEndpoints:
      - $events
      - session/list
      - session/create
      - session/prompt
      - session/cancel
      - session/page
      - session/follow
      - session/control
      - session/rename
      - session/updateQueue
      - session/modelCatalog
      - session/canOpenWorkspacePath
      - workspace/follow
      - agentPresets/list
      - settings/describe

