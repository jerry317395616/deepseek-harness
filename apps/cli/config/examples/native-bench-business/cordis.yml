# Apply last with --patch. Host administrators own this file and all loaded plugins.
# The global policy also covers previously created sessions on shipped coding presets.
- insert:
    - id: native-bench-business-policy
      name: '@deepseek-ai/dsh-tool-native-bench-source/policy'

- id: tools
  config:
    mode: native

- id: agent-presets
  config:
    default: native-bench-business
    includeShippedRoot: true
    includeUserRoot: false
    roots:
      - path: !!js process.env.DSH_NATIVE_BENCH_BUSINESS_PRESET_ROOT ?? process.cwd() + '/apps/cli/config/examples/native-bench-business/presets'
        trust: system

- id: session-controller
  config:
    nativeOpen: false

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.DSH_NATIVE_BENCH_BUSINESS_WORKSPACE ?? '/home/zyd/frappe/native-bench/apps/tongjianyun'
    lockDeploymentPolicy: true

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask

# Approval replies are retained for existing controlled business-record updates.
# They cannot override the monotonic tool guard or the Frappe metadata denylist.
- id: typert-gateway
  config:
    allowedEndpoints:
      - $events
      - $events/result
      - session/list
      - session/create
      - session/prompt
      - session/cancel
      - session/page
      - session/follow
      - session/control
      - session/rename
      - session/updateQueue
      - session/modelCatalog
      - session/canOpenWorkspacePath
      - workspace/follow
      - agentPresets/list
      - settings/describe

