# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# Adapter-policy regression only; this is not a staff deployment profile.
# Both attempts must fail before any Frappe subprocess or credential read.
- insert:
    - id: tool-native-bench-frappe
      name: '@deepseek-ai/dsh-tool-native-bench-frappe'
      config:
        accessMode: business
        benchRoot: /nonexistent/native-bench
        site: example.test
        pythonExecutable: /nonexistent/python
        frappeUser: teacher@example.test
        actorTokenFile: /nonexistent/teacher.assertion
        businessDoctypes: [Student]
        timeoutMs: 5000
